<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Goniometer · Lissajous (Stereo Phase Scope) · APK.audio</title>
  <style>
    :root {
      --bg: #03060f;
      --card-bg: #0a1326;
      --edge: #1d2942;
      --hc: #bcb9df; /* LCARS Lavender/Blue */
      --text: #cfe6ff;
      --dim: #7d93b3;
      --cyan: #6FC8F0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 20%, #0d1730, var(--bg) 85%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 100vh;
    }

    .card-wrap {
      background: var(--card-bg);
      border: 1px solid var(--edge);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      flex: 1;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-radius: 6px;
      padding: 4px 8px;
      background: rgba(188, 185, 223, 0.15);
      border-left: 4px solid var(--hc);
    }
    .card-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--hc);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-title::before {
      content: ":::";
      opacity: 0.6;
      font-family: monospace;
    }
    .header-btns {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-icon {
      background: transparent;
      border: none;
      color: var(--dim);
      font-size: 14px;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .btn-icon:hover { color: var(--text); background: rgba(255, 255, 255, 0.1); }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 4px 0;
    }
    button, label.btn {
      font: bold 10px sans-serif;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid var(--edge);
      background: #0c1730;
      color: var(--text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    button:hover, label.btn:hover {
      background: #152750;
      border-color: var(--hc);
    }
    button.on, label.btn.on {
      background: var(--hc);
      color: #1a1206;
      border-color: var(--hc);
    }
    input[type="file"] { display: none; }

    .ctrl-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
      font-size: 11px;
      font-family: monospace;
      color: var(--dim);
    }
    input[type="range"] {
      accent-color: var(--hc);
      width: 90px;
    }

    .meter-box {
      flex: 1;
      position: relative;
      background: #02050c;
      border: 1px solid var(--edge);
      border-radius: 8px;
      overflow: hidden;
      min-height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .readout {
      display: flex;
      justify-content: space-between;
      font-family: monospace;
      font-size: 11px;
      color: var(--dim);
      padding: 2px 4px;
    }
    .readout b { color: var(--text); }
  </style>
</head>
<body>

  <div class="card-wrap">
    <div class="card-header">
      <div class="card-title">GONIOMETER · LISSAJOUS</div>
      <div class="header-btns">
        <button class="btn-icon" title="Clear Persistence" id="btnReset">↺</button>
        <button class="btn-icon" title="Close" id="btnClose">×</button>
      </div>
    </div>

    <div class="toolbar">
      <button id="btnMono" class="on">│ Mono In-Phase</button>
      <button id="btnStereo">◯ Stereo 90° Phase</button>
      <button id="btnAnti">─ Anti-Phase (Out)</button>
      <button id="btnMic">🎤 Mic In</button>
      <label class="btn" id="lblFile" title="Load Audio File">
        📁 Load Audio
        <input type="file" id="fileIn" accept="audio/*,video/*">
      </label>
      
      <div class="ctrl-group">
        <span>PERSISTENCE:</span>
        <input type="range" id="fadeSlider" min="0.05" max="0.5" step="0.05" value="0.20">
        <span id="fadeVal">0.20</span>
      </div>
    </div>

    <div class="meter-box">
      <canvas id="gonioCanvas"></canvas>
    </div>

    <div class="readout">
      <span>CORRELATION: <b id="corrVal">+1.00</b> (Mono Compatible)</span>
      <span>AXES: <b>M (Mono/Mid)</b> · <b>L (-45°)</b> · <b>R (+45°)</b></span>
      <span>WIDTH: <b id="widthVal">0%</b> (Centered)</span>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
